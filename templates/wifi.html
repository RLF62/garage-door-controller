<!DOCTYPE html>
<html lang="en" class="page-wifi">
<head>
    <meta charset="UTF-8">
    <title>Garage Door Wi-Fi Setup</title>
    
    <link rel="stylesheet" href="/static/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body class="page-wifi">

<div class="card">
    <h2>Garage Door Wi-Fi Setup</h2>

    <form id="wifiForm">
        <label for="ssid">Wi-Fi Network</label>
        <select name="ssid" id="ssid">
            {% for net in networks %}
                <option value="{{ net }}">{{ net }}</option>
            {% endfor %}
        </select>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>

        <button type="submit">Connect</button>
    </form>

    <div class="status" id="status"></div>

    <div class="small">
        After connecting, rejoin your home Wi-Fi and reload the garage page.
    </div>
</div>

<script>
document.getElementById("wifiForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const status = document.getElementById("status");
    status.textContent = "Connecting… please wait";

    const formData = new FormData(this);

    try {
        const res = await fetch("/wifi/connect", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.ok) {
            status.textContent = "Connected! Switching networks…";
        } else {
            status.textContent = "Error: " + data.error;
        }
    } catch (err) {
        status.textContent = "Connection failed";
    }
});
</script>

</body>
</html>
